name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml numpy torch

      - name: Run linter
        run: |
          ruff check --select E9,F63,F7,F82 src/ tests/

      - name: Build Metal kernels (macOS only)
        if: runner.os == 'macOS'
        run: |
          make all

      - name: Install MZSAE
        run: |
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest -v tests/
