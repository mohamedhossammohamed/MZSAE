name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/docs
          cp -r landing/assets site/docs/assets
          sed 's|content="https://mohamedhossammohamed.github.io/MZSAE/"|content="https://mohamedhossammohamed.github.io/MZSAE/docs/"|g; s|href="https://mohamedhossammohamed.github.io/MZSAE/"|href="https://mohamedhossammohamed.github.io/MZSAE/docs/"|g' landing/index.html > site/docs/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
