# Hardware Profile: NVIDIA Hopper H100 / H200 (SM90)
hardware:
  device_type: "cuda"
  chip_name: "NVIDIA H100 SXM5"
  compute_capability: "9.0"
  memory_bandwidth_gbps: 3350.0
  l2_cache_mb: 50.0
  persistent_l2_window_mb: 40.0
  sram_size_kb: 228.0
  recommended_threadgroup_size: 128
  tma_supported: true
  nvlink_bandwidth_gbps: 900.0

kernel:
  block_size_tokens: 64
  head_dim: 128
  num_kv_heads: 4
  num_query_heads: 32
  slow_rope_dims: 16
  sentinel_bytes: 64
  threadgroup_size: 128
  num_splits: 128

eviction:
  default_tau: 16.0
  acc_veto_threshold: 0.40
  ring_buffer_kb: 512
  sleep_batch_size: 128
  sleep_steps: 30

cache:
  num_sinks: 4
  recent_win: 64
  max_active_blocks: null
  capacity_blocks: null

model_weights:
  quantization_type: "fp16"
  quantization_bits: 16
  dynamic_range_scale: 1.0
  tau_multiplier: 1.0
  sentinel_scale: 1.0

use_metal: false
use_cpu_fallback: false
