<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <style>
      .text {
        font-family: sans-serif;
        font-weight: bold;
        font-size: 28px;
        fill: #FFFFFF;
      }
      .node {
        fill: #58A6FF;
      }
      .line {
        stroke: #A371F7;
        stroke-width: 3;
      }
    </style>
  </defs>
  <!-- Background for visibility in light mode -->
  <rect width="200" height="50" fill="#121212" rx="4" />
  
  <!-- Neural Network Motif -->
  <line x1="20" y1="15" x2="40" y2="25" class="line" />
  <line x1="20" y1="35" x2="40" y2="25" class="line" />
  <line x1="40" y1="25" x2="60" y2="15" class="line" />
  <line x1="40" y1="25" x2="60" y2="35" class="line" />
  
  <circle cx="20" cy="15" r="4" class="node" />
  <circle cx="20" cy="35" r="4" class="node" />
  <circle cx="40" cy="25" r="5" class="node" />
  <circle cx="60" cy="15" r="4" class="node" />
  <circle cx="60" cy="35" r="4" class="node" />

  <!-- Text -->
  <text x="75" y="35" class="text">MZSAE</text>
</svg>
