[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzsae"
version = "1.2.0"
description = "Neuromorphic Sparse Attention Engine: Hardware-Sympathetic Sparse Continual Attention on Apple Silicon"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohammed Hossam Zahran" }]
keywords = ["attention", "sparse-attention", "apple-silicon", "metal", "kv-cache", "llm-inference", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "build>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mzsae = [
    "*.dylib",
    "*.metal",
    "**/*.dylib",
    "**/*.metal",
    "**/*.h",
    "**/*.mm",
    "**/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
exclude = [
    "fastattn*",
    "tools_llamacpp",
    "work_*",
    "analyze_*.py",
    "validate_*.py",
    "capture_*.py",
    "replay_*.py",
    "run_*.py",
    "verdict.py",
    "bench_*.py",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
